[package]
name = "tomi-api"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
publish = false

[dependencies]
axum = "0.8"
base64 = "0.22"
jiff = { version = "0.2.38", default-features = false, features = ["std", "tzdb-bundle-always"] }
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "json", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["trace", "request-id", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1"
p256 = { version = "0.13", features = ["jwk", "pem", "pkcs8"] }
rand_core = { version = "0.6", features = ["getrandom"] }
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }

# Readability limits live in clippy.toml. CI turns every warning into an
# error, so these are rules, not suggestions. See AGENTS.md.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
cognitive_complexity = "warn"
dbg_macro = "warn"
expect_used = "warn"
panic = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
too_many_lines = "warn"
unimplemented = "warn"
unwrap_used = "warn"
