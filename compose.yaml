# Local development: Postgres and the API, with a hand-made sign-in secret
# instead of a Supabase project. `docker compose up --build`, then see
# docs/local-development.md for a test token. Never use these values anywhere real.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/postgres
      SUPABASE_URL: http://localhost:54321
      SUPABASE_JWT_SECRET: local-dev-secret-at-least-32-characters-long
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GRAPH_ALLOW_DRAFT: "true"
      RUST_LOG: info

volumes:
  pgdata:
