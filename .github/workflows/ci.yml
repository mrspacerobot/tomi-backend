name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/check.sh
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

  # Fetches the graph release that graph.lock pins and builds the image with it.
  # The token is read-only and sees only the graph repository. While graph.lock
  # says none, the fetch does nothing and the image builds without a graph.
  graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The token can see the graph repository
        env:
          GH_TOKEN: ${{ secrets.GRAPH_READ_TOKEN }}
        run: |
          if ! gh api repos/mrspacerobot/cooking-graph --jq .full_name; then
            echo "GRAPH_READ_TOKEN cannot read mrspacerobot/cooking-graph. It may have expired: create a new fine-grained token with read-only Contents access to that repository and run gh secret set GRAPH_READ_TOKEN." >&2
            exit 1
          fi
      - name: Fetch the pinned graph and check its checksum
        env:
          GH_TOKEN: ${{ secrets.GRAPH_READ_TOKEN }}
        run: ./scripts/fetch-graph.sh
      - name: The server agrees with the graph's reference on every shipped case
        run: |
          if [ -f graph/serving-vectors.json ]; then
            cargo test --test graph_vectors -- --ignored
          else
            echo "graph.lock pins no graph, so there are no cases to check."
          fi
      - name: Build the image
        run: docker build -t tomi-api .
